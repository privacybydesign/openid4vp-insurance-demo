# Status checks, using the shared workflows from privacybydesign/github-workflows.
# The gate job "Status checks passed" is the one check to require.
name: Status checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  backend:
    uses: privacybydesign/github-workflows/.github/workflows/node-checks.yml@v1
    permissions:
      contents: read
    with:
      working-directory: backend
      node-version: "22" # same as the node:22-alpine image
      scripts: typecheck # tsc --noEmit; no lint/test/build scripts
      ignore-scripts: true

  frontend:
    uses: privacybydesign/github-workflows/.github/workflows/node-checks.yml@v1
    permissions:
      contents: read
    with:
      working-directory: frontend
      node-version: "22" # same as the node:22-alpine image
      scripts: typecheck build # tsc -b --noEmit, then tsc -b && vite build
      ignore-scripts: true

  # Builds and scans both images without pushing them; Delivery pushes from main.
  docker:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image-name: ghcr.io/${{ github.repository }}-${{ matrix.service }}
      context: ${{ matrix.service }}
      dockerfile: ${{ matrix.service }}/Dockerfile
      push-image: false

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: privacybydesign/github-workflows/.github/workflows/dependency-review.yml@v1
    permissions:
      contents: read
      pull-requests: write

  workflow-lint:
    uses: privacybydesign/github-workflows/.github/workflows/workflow-lint.yml@v1
    permissions:
      contents: read

  passed:
    name: Status checks passed
    if: always()
    needs: [backend, frontend, docker, dependency-review, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"(failure|cancelled)"' <<< "$RESULTS"; then exit 1; fi
