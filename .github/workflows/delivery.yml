# Delivery: builds, scans and pushes ghcr.io/privacybydesign/openid4vp-insurance-demo-backend
# and -frontend. Push to main -> :edge, release vX.Y.Z -> :X.Y.Z and :latest,
# manual run -> :<branch>. PR builds are scanned in Status checks; published
# images are re-scanned weekly by image-rescan.yml.
name: Delivery

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image-name: ghcr.io/${{ github.repository }}-${{ matrix.service }}
      context: ${{ matrix.service }}
      dockerfile: ${{ matrix.service }}/Dockerfile
      # The old Delivery tagged :latest on every stable release (metadata-action's
      # latest=auto with type=semver); keep doing so.
      tag-latest: true
